{% extends "base.html" %}{% block content %}
<div class="auth-wrap"><div class="auth-box compact">
<div class="eyebrow">{{"PROFESSIONAL" if role=="provider" else "CUSTOMER"}} LOGIN</div>
<h2>Welcome back</h2><p class="muted">Login with your registered email and password.</p>
<form method="post">
<label>Email ID<input type="email" name="email" required></label>
<label>Password<input type="password" name="password" required></label>
<button class="btn accent wide">Login →</button>
</form>
<p class="switch">New here? <a href="{{url_for('register',role=role)}}">Create account</a></p>
</div></div>
{% endblock %}
